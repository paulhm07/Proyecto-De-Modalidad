<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="owlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="50%" stop-color="#ff8c42" />
      <stop offset="100%" stop-color="#ffb627" />
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1e6" />
      <stop offset="100%" stop-color="#ffe2c9" />
    </linearGradient>
  </defs>

  <!-- Ears / Tufts -->
  <path d="M22 22 L30 6 L38 24 Z" fill="url(#owlGrad)" />
  <path d="M78 22 L70 6 L62 24 Z" fill="url(#owlGrad)" />

  <!-- Body / Head (single round shape) -->
  <path d="M50 14 C28 14 14 30 14 50 C14 72 30 86 50 86 C70 86 86 72 86 50 C86 30 72 14 50 14 Z"
        fill="url(#owlGrad)" />

  <!-- Belly -->
  <ellipse cx="50" cy="58" rx="22" ry="24" fill="url(#bellyGrad)" opacity="0.92" />

  <!-- Eye whites -->
  <circle cx="38" cy="44" r="13" fill="#ffffff" />
  <circle cx="62" cy="44" r="13" fill="#ffffff" />

  <!-- Pupils -->
  <circle cx="40" cy="45" r="6.5" fill="#2d1437" />
  <circle cx="60" cy="45" r="6.5" fill="#2d1437" />
  <!-- Eye glints -->
  <circle cx="42.5" cy="42.5" r="2" fill="#ffffff" />
  <circle cx="62.5" cy="42.5" r="2" fill="#ffffff" />

  <!-- Beak -->
  <path d="M50 50 L44 58 Q50 64 56 58 Z" fill="#ff6b6b" stroke="#c2410c" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Tiny wings -->
  <path d="M20 56 Q12 64 18 74 Q26 70 28 60 Z" fill="url(#owlGrad)" />
  <path d="M80 56 Q88 64 82 74 Q74 70 72 60 Z" fill="url(#owlGrad)" />
