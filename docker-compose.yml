version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: educaplay_db
    restart: always
    environment:
      POSTGRES_DB: educaplay
      POSTGRES_USER: educaplay_user
      POSTGRES_PASSWORD: educaplay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
