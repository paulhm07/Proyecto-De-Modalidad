services:
  postgres:
    image: postgres:16-alpine
    container_name: mundilex-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mundilex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mundilex"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Proyecto-De-Modalidad/backend
      dockerfile: Dockerfile
    container_name: mundilex-backend
    restart: always
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/mundilex?schema=public
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mundilex-frontend
    restart: always
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:

